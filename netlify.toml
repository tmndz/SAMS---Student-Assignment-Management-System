[build]
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/canvas-proxy/lifeacademy/*"
  to = "https://lifeacademy.instructure.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/canvas-proxy/canvas/*"
  to = "https://canvas.instructure.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/canvas-proxy"
  to = "/.netlify/functions/canvas-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
